<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dinidu Sachintha — Senior Software Engineer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Single Page App redirect for static hosts (GitHub Pages, etc.)
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background:#080808;color:#f5f4f0;font-family:sans-serif;padding:2rem;text-align:center;">
    <p>Redirecting to Dinidu Sachintha's Portfolio...</p>
  </body>
</html>
